[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.34"
optimizer = false
optimizer_runs = 200

# Verified deployment on Sepolia uses solc 0.8.34, optimizer disabled.

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
